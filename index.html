<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CosmiMail</title>

    <meta name="theme-color"
          content="#071321">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<canvas id="starfield"></canvas>

<div id="background-glow"></div>

<div id="app">

    <aside id="sidebar">

        <header id="brand">

            <div id="brand-logo">

                <!-- Cosmiway animated logo -->

            </div>

            <div id="brand-info">

                <h1>

                    CosmiMail

                </h1>

                <p>

                    Email that Works For You.

                </p>

            </div>

        </header>

        <nav id="sidebar-navigation">

            <section class="navigation-group">

                <h2>

                    MAIL

                </h2>

                <button
                    class="nav-button active"
                    data-label="INBOX">

                    <svg viewBox="0 0 24 24">

                        <path d="M3 6h18v12H3z"/>

                        <path d="M3 6l9 8 9-8"/>

                    </svg>

                    <span>

                        Inbox

                    </span>

                </button>

                <button
                    class="nav-button"
                    data-label="STARRED">

                    <svg viewBox="0 0 24 24">

                        <path d="M12 2l3 7h7l-5.5 4.3L18 21l-6-3.8L6 21l1.5-7.7L2 9h7z"/>

                    </svg>

                    <span>

                        Starred

                    </span>

                </button>

                <button
                    class="nav-button"
                    data-label="IMPORTANT">

                    <svg viewBox="0 0 24 24">

                        <path d="M12 2l9 4v6c0 6-4 9-9 10-5-1-9-4-9-10V6z"/>

                    </svg>

                    <span>

                        Important

                    </span>

                </button>

                <button
                    class="nav-button"
                    data-label="SENT">

                    <svg viewBox="0 0 24 24">

                        <path d="M2 12L22 3 18 21 12 14 2 12z"/>

                    </svg>

                    <span>

                        Sent

                    </span>

                </button>

                <button
                    class="nav-button"
                    data-label="DRAFT">

                    <svg viewBox="0 0 24 24">

                        <path d="M4 4h16v16H4z"/>

                        <path d="M7 8h10M7 12h10"/>

                    </svg>

                    <span>

                        Drafts

                    </span>

                </button>

                <button
                    class="nav-button"
                    data-label="SPAM">

                    <svg viewBox="0 0 24 24">

                        <circle cx="12"
                                cy="12"
                                r="9"/>

                        <path d="M12 7v6"/>

                        <circle cx="12"
                                cy="17"
                                r="1"/>

                    </svg>

                    <span>

                        Spam

                    </span>

                </button>

                <button
                    class="nav-button"
                    data-label="TRASH">

                    <svg viewBox="0 0 24 24">

                        <path d="M4 7h16"/>

                        <path d="M7 7V4h10v3"/>

                        <path d="M8 7v13h8V7"/>

                    </svg>

                    <span>

                        Trash

                    </span>

                </button>

            </section>

            <section
                id="categories-group"
                class="navigation-group">

                <h2>

                    CATEGORIES

                </h2>

                <!-- Generated by JavaScript -->

            </section>

            <section
                id="labels-group"
                class="navigation-group">

                <h2>

                    LABELS

                </h2>

                <!-- Generated by JavaScript -->

            </section>

        </nav>

        <footer id="sidebar-footer">

            <button id="settings-button">

                <svg viewBox="0 0 24 24">

                    <path d="M12 8a4 4 0 100 8 4 4 0 000-8z"/>

                    <path d="M3 12h2m14 0h2M12 3v2m0 14v2"/>

                </svg>

                <span>

                    Settings

                </span>

            </button>

        </footer>

    </aside>

    <main id="main">

        <header id="topbar">

            <div id="search-container">

                <button
                    id="search-button"
                    aria-label="Search">

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="11"
                            cy="11"
                            r="7"></circle>

                        <line
                            x1="16"
                            y1="16"
                            x2="21"
                            y2="21"></line>

                    </svg>

                </button>

                <input
                    id="search"
                    type="search"
                    autocomplete="off"
                    spellcheck="false"
                    placeholder="Search mail">

            </div>

            <div id="topbar-actions">

                <button
                    id="compose-button">

                    <svg viewBox="0 0 24 24">

                        <path d="M12 5v14"></path>

                        <path d="M5 12h14"></path>

                    </svg>

                    <span>

                        Compose

                    </span>

                </button>

                <button
                    id="refresh-button"
                    aria-label="Refresh">

                    <svg viewBox="0 0 24 24">

                        <path d="M21 12a9 9 0 10-3 6.7"></path>

                        <path d="M21 3v6h-6"></path>

                    </svg>

                </button>

                <button
                    id="profile-button">

                    <div id="avatar">

                        S

                    </div>

                    <div id="profile-info">

                        <span id="username">

                            Loading...

                        </span>

                        <span id="useremail">

                            ...

                        </span>

                    </div>

                </button>

            </div>

        </header>

        <section id="workspace">

            <section id="mail-list-panel">

                <header id="mail-list-header">

                    <div>

                        <h2 id="folder-title">

                            Inbox

                        </h2>

                        <span id="mail-count">

                            Loading...

                        </span>

                    </div>

                    <button
                        id="folder-options">

                        <svg viewBox="0 0 24 24">

                            <circle cx="12"
                                    cy="5"
                                    r="1.5"></circle>

                            <circle cx="12"
                                    cy="12"
                                    r="1.5"></circle>

                            <circle cx="12"
                                    cy="19"
                                    r="1.5"></circle>

                        </svg>

                    </button>

                </header>

                <div id="mail-list">

                    <!-- Emails generated here -->

                </div>

            </section>

            <section id="reader-panel">

                <div
                    id="reader-empty">

                    <div id="reader-empty-logo">

                    </div>

                    <h2>

                        Welcome to CosmiMail

                    </h2>

                    <p>

                        Select an email to begin reading.

                    </p>

                </div>

                <article
                    id="reader"
                    hidden>

                    <header id="reader-toolbar">

                        <button
                            id="reply-button">

                            Reply

                        </button>

                        <button
                            id="forward-button">

                            Forward

                        </button>

                        <button
                            id="archive-button">

                            Archive

                        </button>

                        <button
                            id="delete-button">

                            Delete

                        </button>

                    </header>

                    <section id="reader-header">

                        <h1 id="email-subject">

                        </h1>

                        <div id="email-meta">

                            <div class="meta-row">

                                <span class="meta-title">

                                    From

                                </span>

                                <span id="email-from">

                                </span>

                            </div>

                            <div class="meta-row">

                                <span class="meta-title">

                                    To

                                </span>

                                <span id="email-to">

                                </span>

                            </div>

                            <div class="meta-row">

                                <span class="meta-title">

                                    Date

                                </span>

                                <span id="email-date">

                                </span>

                            </div>

                        </div>

                    </section>

                    <section
                        id="email-body">

                    </section>

                                    </article>

            </section>

        </section>

    </main>

</div>

<!-- ===================================================== -->
<!-- COMPOSE PANEL -->
<!-- ===================================================== -->

<aside
    id="compose-panel"
    hidden>

    <header id="compose-header">

        <h2>

            New Message

        </h2>

        <button
            id="compose-close">

            <svg viewBox="0 0 24 24">

                <path d="M6 6l12 12"></path>

                <path d="M18 6L6 18"></path>

            </svg>

        </button>

    </header>

    <section id="compose-content">

        <input
            id="compose-to"
            type="email"
            placeholder="Recipients">

        <input
            id="compose-subject"
            type="text"
            placeholder="Subject">

        <textarea
            id="compose-body"
            placeholder="Write your message..."></textarea>

    </section>

    <footer id="compose-footer">

        <button
            id="attachment-button">

            <svg viewBox="0 0 24 24">

                <path d="M8 12l6-6a3 3 0 114 4l-8 8a5 5 0 11-7-7l8-8"></path>

            </svg>

            <span>

                Attach

            </span>

        </button>

        <button
            id="send-button">

            <svg viewBox="0 0 24 24">

                <path d="M2 12L22 3 18 21 12 14 2 12z"></path>

            </svg>

            <span>

                Send

            </span>

        </button>

    </footer>

</aside>

<!-- ===================================================== -->
<!-- LOADING -->
<!-- ===================================================== -->

<div
    id="loading-overlay"
    hidden>

    <div id="loading-logo">

        <!-- Cosmiway Orbit -->

    </div>

    <span id="loading-text">

        Contacting the Stars...

    </span>

</div>

<!-- ===================================================== -->
<!-- TOAST -->
<!-- ===================================================== -->

<div
    id="toast"
    hidden>

</div>

<!-- ===================================================== -->
<!-- EMAIL TEMPLATE -->
<!-- ===================================================== -->

<template id="email-template">

    <article
        class="mail-item">

        <div class="mail-status">

            <span class="unread-indicator">

            </span>

        </div>

        <div class="mail-content">

            <header class="mail-header">

                <span class="mail-sender">

                </span>

                <time class="mail-date">

                </time>

            </header>

            <h3 class="mail-subject">

            </h3>

            <p class="mail-snippet">

            </p>

        </div>

    </article>

</template>

<!-- ===================================================== -->
<!-- LABEL TEMPLATE -->
<!-- ===================================================== -->

<template id="label-template">

    <button
        class="nav-button">

        <svg
            class="label-icon"
            viewBox="0 0 24 24">

            <path></path>

        </svg>

        <span class="label-name">

        </span>

    </button>

</template>

<!-- ===================================================== -->
<!-- SCRIPT -->
<!-- ===================================================== -->

<script src="script.js"></script>

</body>

</html>
