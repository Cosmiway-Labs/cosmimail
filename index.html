<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CosmiMail</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>

        <div id="logo">
            ✉️ CosmiMail
        </div>

        <div id="search-container">
            <input
                id="search"
                type="text"
                placeholder="Search mail..."
            >
        </div>

        <div id="top-actions">
            <button>⚙</button>
            <button>👤</button>
        </div>

    </header>

    <main>

        <aside id="ai-panel"></aside>

        <section id="inbox"></section>

        <section id="email-view"></section>

    </main>

    <script src="script.js"></script>

</body>
</html>
